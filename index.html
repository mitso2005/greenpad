<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GreenPad</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container-middle">
        <div class="toolbar">
            <button onclick="document.execCommand('bold')">Bold</button>
            <button onclick="document.execCommand('italic')">Italic</button>
            <button onclick="document.execCommand('underline')">Underline</button>
            <button onclick="clearText()">Clear</button>
        </div>
        <div id="editor" contenteditable="true" class="editor"></div>
        <script src="script.js"></script>
    </div>

    <div id= "setGoal" class="modal">
        <div class="modal-contnet">
            <h2>How much do you want to write a day?</h2>
            <input 
            type="range"
            id="goalSlider"
            min="50" 
            max="2000" 
            step="10" 
            value="300"
            oninput="updateSliderValue(this.value)">
            <p>Goal: <span id="sliderValue">300</span> words</p>
            <button id="startWritingBtn" onclick="setGoal()">Start Writing</button>
        </div>
    </div>

    <div class="container-left">
        <div id="documents">
            
        </div>
    </div>

    <div class="container-right">
        <div id="wordCounter">
            <span id="wordCount"></span>
        </div>
    </div>

</body>
</html>
